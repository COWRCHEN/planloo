name = "planloo-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]


# Default environment (development)
# Required: create D1 DB and set database_id below, or `npm run dev` will fail (API 10021).
#   npx wrangler d1 create planloo-db-dev
#   Then paste the returned uuid into database_id below.
[env.development]
name = "planloo-api-dev"

[[env.development.d1_databases]]
binding = "DB"
database_name = "planloo-db-dev"
database_id = "87052909-41d8-4c33-9811-8762f16dc58e" # from `wrangler d1 create planloo-db-dev`
migrations_dir = "drizzle"

[env.development.triggers]
crons = ["0 3 * * *"]

[env.development.vars]
ENVIRONMENT = "development"
FRONTEND_URL = "http://10.0.48.174:4321"
STRIPE_PRICE_PERSONAL_MONTHLY = "price_1T73nYFWgv0e5jhpU7H0I8QH"
STRIPE_PRICE_PERSONAL_ANNUAL  = "price_1T752eFWgv0e5jhpXD7k0CgU"
STRIPE_PRICE_PLANNER_MONTHLY  = "price_1T73waFWgv0e5jhpfpYyOHyD"
STRIPE_PRICE_PLANNER_ANNUAL   = "price_1T7511FWgv0e5jhp1DpzZLF7"
STRIPE_PRICE_AGENCY_MONTHLY   = "price_1T73z6FWgv0e5jhpnEYP7v8t"
STRIPE_PRICE_AGENCY_ANNUAL    = "price_1T73zgFWgv0e5jhpWxqhdrzB"

# Unit-based prices — create these in Stripe and paste IDs here
STRIPE_PRICE_BASIC_PLAN_MONTHLY    = ""
STRIPE_PRICE_BASIC_PLAN_ANNUAL     = ""
STRIPE_PRICE_EVENTS_MONTHLY        = ""
STRIPE_PRICE_EVENTS_ANNUAL         = ""
STRIPE_PRICE_GUESTS_MONTHLY        = ""
STRIPE_PRICE_GUESTS_ANNUAL         = ""
STRIPE_PRICE_EMAILS_MONTHLY        = ""
STRIPE_PRICE_EMAILS_ANNUAL         = ""
STRIPE_PRICE_SMS_MONTHLY           = ""
STRIPE_PRICE_SMS_ANNUAL            = ""
STRIPE_PRICE_COLLABORATORS_MONTHLY = ""
STRIPE_PRICE_COLLABORATORS_ANNUAL  = ""
STRIPE_PRICE_CUSTOM_FIELDS_MONTHLY = ""
STRIPE_PRICE_CUSTOM_FIELDS_ANNUAL  = ""
STRIPE_PRICE_ORG_MEMBERS_MONTHLY   = ""
STRIPE_PRICE_ORG_MEMBERS_ANNUAL    = ""
STRIPE_PRICE_FLOOR_PLANS_MONTHLY   = ""
STRIPE_PRICE_FLOOR_PLANS_ANNUAL    = ""
STRIPE_PRICE_ORGANIZATIONS_MONTHLY = ""
STRIPE_PRICE_ORGANIZATIONS_ANNUAL  = ""
STRIPE_PRICE_AUDIT_HISTORY_MONTHLY = ""
STRIPE_PRICE_AUDIT_HISTORY_ANNUAL  = ""

# KV namespace for rate limiting (optional in dev)
# Create with: wrangler kv:namespace create "RATE_LIMIT" --env development --preview
# [[env.development.kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = ""  # Add ID after creating namespace
# preview_id = ""  # Add preview ID after creating namespace

# R2 bucket for uploads
# Create with: wrangler r2 bucket create planloo-uploads-dev
[[env.development.r2_buckets]]
binding = "UPLOADS_BUCKET"
bucket_name = "planloo-uploads-dev"
# Need to add preview_bucket_name for local development
preview_bucket_name = "planloo-uploads-dev"

# Staging environment
[env.staging]
name = "planloo-api-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "planloo-db-staging"
database_id = "" # Will be generated after creating D1 database
migrations_dir = "drizzle"

[env.staging.triggers]
crons = ["0 3 * * *"]

[env.staging.vars]
ENVIRONMENT = "staging"
FRONTEND_URL = "https://staging.planloo.com"

# KV namespace for rate limiting
# Create with: wrangler kv:namespace create "RATE_LIMIT" --env staging
[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = ""  # Add ID after creating namespace

# R2 bucket for uploads
# Create with: wrangler r2 bucket create planloo-uploads-staging
[[env.staging.r2_buckets]]
binding = "UPLOADS_BUCKET"
bucket_name = "planloo-uploads-staging"

# Production environment
[env.production]
name = "planloo-api"
route = { pattern = "api.planloo.com/*", zone_name = "planloo.com" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "planloo-db"
database_id = "" # Will be generated after creating D1 database
migrations_dir = "drizzle"

[env.production.triggers]
crons = ["0 3 * * *"]

[env.production.vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://planloo.com"
STRIPE_PRICE_PERSONAL_MONTHLY = "prod_U5EGZea0ylRtAq"
STRIPE_PRICE_PERSONAL_ANNUAL  = "prod_U5EGZea0ylRtAq"
STRIPE_PRICE_PLANNER_MONTHLY  = "prod_U5EPJyWwcOaJQ9"
STRIPE_PRICE_PLANNER_ANNUAL   = "prod_U5EPJyWwcOaJQ9"
STRIPE_PRICE_AGENCY_MONTHLY   = "prod_U5ESjsSzQ8HCpx"
STRIPE_PRICE_AGENCY_ANNUAL    = "prod_U5ESjsSzQ8HCpx"

# KV namespace for rate limiting
# Create with: wrangler kv:namespace create "RATE_LIMIT" --env production
[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = ""  # Add ID after creating namespace

# R2 bucket for uploads
# Create with: wrangler r2 bucket create planloo-uploads
[[env.production.r2_buckets]]
binding = "UPLOADS_BUCKET"
bucket_name = "planloo-uploads"

# Secrets (set via `wrangler secret put <KEY>` for each environment)
# BETTER_AUTH_SECRET
# EMAIL_API_KEY
# GOOGLE_CLIENT_ID (optional)
# GOOGLE_CLIENT_SECRET (optional)

# Local development
[dev]
port = 8787
local_protocol = "http"
ip = "0.0.0.0"
