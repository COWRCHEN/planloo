name = "planloo-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Default environment (development)
# Required: create D1 DB and set database_id below, or `npm run dev` will fail (API 10021).
#   npx wrangler d1 create planloo-db-dev
#   Then paste the returned uuid into database_id below.
[env.development]
name = "planloo-api-dev"

[[env.development.d1_databases]]
binding = "DB"
database_name = "planloo-db-dev"
database_id = "87052909-41d8-4c33-9811-8762f16dc58e" # from `wrangler d1 create planloo-db-dev`
migrations_dir = "drizzle"

[env.development.vars]
ENVIRONMENT = "development"
FRONTEND_URL = "http://localhost:4321"

# KV namespace for rate limiting (optional in dev)
# Create with: wrangler kv:namespace create "RATE_LIMIT" --env development --preview
# [[env.development.kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = ""  # Add ID after creating namespace
# preview_id = ""  # Add preview ID after creating namespace

# R2 bucket for uploads
# Create with: wrangler r2 bucket create planloo-uploads-dev
[[env.development.r2_buckets]]
binding = "UPLOADS_BUCKET"
bucket_name = "planloo-uploads-dev"
# Need to add preview_bucket_name for local development
preview_bucket_name = "planloo-uploads-dev"

# Staging environment
[env.staging]
name = "planloo-api-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "planloo-db-staging"
database_id = "" # Will be generated after creating D1 database
migrations_dir = "drizzle"

[env.staging.vars]
ENVIRONMENT = "staging"
FRONTEND_URL = "https://staging.planloo.com"

# KV namespace for rate limiting
# Create with: wrangler kv:namespace create "RATE_LIMIT" --env staging
[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = ""  # Add ID after creating namespace

# R2 bucket for uploads
# Create with: wrangler r2 bucket create planloo-uploads-staging
[[env.staging.r2_buckets]]
binding = "UPLOADS_BUCKET"
bucket_name = "planloo-uploads-staging"

# Production environment
[env.production]
name = "planloo-api"
route = { pattern = "api.planloo.com/*", zone_name = "planloo.com" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "planloo-db"
database_id = "" # Will be generated after creating D1 database
migrations_dir = "drizzle"

[env.production.vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://planloo.com"

# KV namespace for rate limiting
# Create with: wrangler kv:namespace create "RATE_LIMIT" --env production
[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = ""  # Add ID after creating namespace

# R2 bucket for uploads
# Create with: wrangler r2 bucket create planloo-uploads
[[env.production.r2_buckets]]
binding = "UPLOADS_BUCKET"
bucket_name = "planloo-uploads"

# Secrets (set via `wrangler secret put <KEY>` for each environment)
# BETTER_AUTH_SECRET
# EMAIL_API_KEY
# GOOGLE_CLIENT_ID (optional)
# GOOGLE_CLIENT_SECRET (optional)

# Local development
[dev]
port = 8787
local_protocol = "http"
